<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM 파트 3분기 회식 투표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 폰트 설정 (Pretendard) */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        /* 날짜 체크박스 클릭 애니메이션 */
        input[name="date"]:checked + div {
            border-color: #6366f1;
            background-color: rgba(99, 102, 241, 0.1);
        }
        input[name="date"]:checked + div .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        /* 장소 체크박스 클릭 애니메이션 (에메랄드 테마) */
        input[name="restaurant"]:checked + div {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }
        input[name="restaurant"]:checked + div .rest-check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 메인 컨테이너 -->
    <div class="bg-slate-800/80 backdrop-blur-xl p-8 rounded-[2rem] shadow-[0_0_50px_rgba(99,102,241,0.15)] border border-slate-700 w-full max-w-md my-8 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>

        <div class="text-center mb-10 mt-2">
            <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-emerald-400">
                🎉 SPM 3분기 회식
            </h1>
            <p class="text-slate-400 mt-3 font-medium">일정과 장소를 트렌디하게 골라주세요!</p>
        </div>

        <!-- 1. 로그인 섹션 -->
        <div id="loginSection" class="space-y-5">
            <div>
                <label for="userName" class="block text-sm font-medium text-slate-300 mb-2">참여자 이름</label>
                <input type="text" id="userName" placeholder="이름을 입력하세요" 
                    class="w-full px-5 py-4 bg-slate-900/50 border border-slate-600 rounded-2xl text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
            </div>
            
            <div>
                <label for="userPassword" class="block text-sm font-medium text-slate-300 mb-2 mt-4">입장 코드 (핸드폰 뒷 4자리)</label>
                <input type="password" id="userPassword" placeholder="비밀번호 입력" 
                    class="w-full px-5 py-4 bg-slate-900/50 border border-slate-600 rounded-2xl text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
            </div>

            <button id="loginBtn" 
                class="w-full mt-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_4px_14px_0_rgba(99,102,241,0.39)] transition-all transform hover:-translate-y-0.5">
                로그인 및 투표 시작
            </button>
            <p id="loginError" class="text-rose-400 text-sm text-center hidden font-medium"></p>
        </div>

        <!-- 2. 투표 폼 섹션 -->
        <form id="voteForm" class="hidden space-y-4">
            
            <!-- [A] 날짜 투표 -->
            <div class="flex items-center justify-between mb-4 mt-2">
                <h3 class="text-lg font-bold text-white">1. 참석 가능한 일자</h3>
                <span class="text-xs font-semibold bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-md">중복 가능</span>
            </div>
            
            <!-- 날짜 옵션들 (동일) -->
            <label class="block cursor-pointer relative">
                <input type="checkbox" name="date" value="9월 10일 (목)" class="peer sr-only">
                <div class="border-2 border-slate-600 rounded-2xl p-4 transition-all flex items-center justify-between hover:bg-slate-700/50">
                    <span class="text-lg font-medium text-slate-200">🗓️ 9월 10일 (목)</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-500 flex items-center justify-center peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-all">
                        <svg class="w-4 h-4 text-white opacity-0 transform scale-50 transition-all check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            </label>
            <label class="block cursor-pointer relative">
                <input type="checkbox" name="date" value="9월 11일 (금)" class="peer sr-only">
                <div class="border-2 border-slate-600 rounded-2xl p-4 transition-all flex items-center justify-between hover:bg-slate-700/50">
                    <span class="text-lg font-medium text-slate-200">🗓️ 9월 11일 (금)</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-500 flex items-center justify-center peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-all">
                        <svg class="w-4 h-4 text-white opacity-0 transform scale-50 transition-all check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            </label>
            <label class="block cursor-pointer relative">
                <input type="checkbox" name="date" value="9월 17일 (목)" class="peer sr-only">
                <div class="border-2 border-slate-600 rounded-2xl p-4 transition-all flex items-center justify-between hover:bg-slate-700/50">
                    <span class="text-lg font-medium text-slate-200">🗓️ 9월 17일 (목)</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-500 flex items-center justify-center peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-all">
                        <svg class="w-4 h-4 text-white opacity-0 transform scale-50 transition-all check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            </label>
            <label class="block cursor-pointer relative">
                <input type="checkbox" name="date" value="9월 18일 (금)" class="peer sr-only">
                <div class="border-2 border-slate-600 rounded-2xl p-4 transition-all flex items-center justify-between hover:bg-slate-700/50">
                    <span class="text-lg font-medium text-slate-200">🗓️ 9월 18일 (금)</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-500 flex items-center justify-center peer-checked:bg-indigo-500 peer-checked:border-indigo-500 transition-all">
                        <svg class="w-4 h-4 text-white opacity-0 transform scale-50 transition-all check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            </label>

            <hr class="my-8 border-slate-700 border-t-2 rounded">

            <!-- [B] 장소 투표 -->
            <div class="flex items-center justify-between mb-4 mt-2">
                <h3 class="text-lg font-bold text-white">2. 가장 끌리는 장소</h3>
                <span class="text-xs font-semibold bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-md">최대 2곳 선택</span>
            </div>

            <!-- 큰집막창생고기 -->
            <label class="block cursor-pointer relative">
                <input type="checkbox" name="restaurant" value="큰집막창생고기" class="peer sr-only">
                <div class="border-2 border-slate-600 rounded-2xl p-4 transition-all flex items-center justify-between hover:bg-slate-700/50">
                    <div class="flex flex-col gap-1">
                        <span class="text-lg font-medium text-slate-200">🥩 큰집막창생고기</span>
                        <a href="https://map.naver.com/p/entry/place/1375980109?lng=127.0817834&lat=37.1350331&placePath=%2Fhome&entry=plt&searchType=place" 
                           target="_blank" onclick="event.stopPropagation()" 
                           class="text-xs w-max bg-slate-700 hover:bg-slate-600 text-emerald-300 px-2 py-1 rounded-md transition-colors flex items-center gap-1">
                            🗺️ 네이버 지도 보기
                        </a>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-500 flex items-center justify-center peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all">
                        <svg class="w-4 h-4 text-white opacity-0 transform scale-50 transition-all rest-check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            </label>

            <!-- 후대화로 -->
            <label class="block cursor-pointer relative">
                <input type="checkbox" name="restaurant" value="후대화로 오산점" class="peer sr-only">
                <div class="border-2 border-slate-600 rounded-2xl p-4 transition-all flex items-center justify-between hover:bg-slate-700/50">
                    <div class="flex flex-col gap-1">
                        <span class="text-lg font-medium text-slate-200">🔥 후대화로 오산점</span>
                        <a href="https://map.naver.com/p/entry/place/1593781320?c=15.00,0,0,0,dh&placePath=%2Fhome%3Ffrom%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202607291521%26locale%3Dko%26svcName%3Dmap_pcv5" 
                           target="_blank" onclick="event.stopPropagation()" 
                           class="text-xs w-max bg-slate-700 hover:bg-slate-600 text-emerald-300 px-2 py-1 rounded-md transition-colors flex items-center gap-1">
                            🗺️ 네이버 지도 보기
                        </a>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-500 flex items-center justify-center peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all">
                        <svg class="w-4 h-4 text-white opacity-0 transform scale-50 transition-all rest-check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                </div>
            </label>

            <p id="formError" class="text-rose-400 text-sm text-center hidden font-bold mt-4"></p>

            <button type="submit" 
                class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-4 px-4 rounded-2xl shadow-[0_4px_14px_0_rgba(16,185,129,0.39)] transition-all transform hover:-translate-y-0.5 text-lg">
                ✅ 투표 제출하기
            </button>
        </form>

        <!-- 3. 결과 및 실시간 집계 표시 섹션 -->
        <div id="messageSection" class="hidden mt-6 text-center p-6 rounded-2xl border backdrop-blur-sm">
            <h3 id="messageTitle" class="text-xl font-bold mb-2"></h3>
            <p id="messageText" class="text-slate-300 mb-6"></p>

            <button id="modifyVoteBtn" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all mb-6 text-md border border-slate-600">
                ✏️ 내 투표 다시하기
            </button>
            
            <div id="resultContainer" class="text-left mt-2"></div>
        </div>

    </div>

    <!-- 파이어베이스 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGHqvXTsfSFMcfECmfY35Z6JPkXpKJRf4",
            authDomain: "dinnder-vote.firebaseapp.com",
            projectId: "dinnder-vote",
            storageBucket: "dinnder-vote.firebasestorage.app",
            messagingSenderId: "1064660161021",
            appId: "1:1064660161021:web:c3484d8b2ff65fb9b18994"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const allowedUsers = {
            "이루리": "2625", "윤정웅": "5442", "장형원": "0973", "장민규": "5436",
            "정용래": "2458", "이태범": "6286", "김남중": "5054", "안동현": "4574",
            "강현준": "9220", "이규빈": "1579", "임성훈": "0449", "박원석": "3817",
            "정재훈": "9685", "조재영": "3178", "테스트": "1234"
        };

        const loginSection = document.getElementById('loginSection');
        const voteForm = document.getElementById('voteForm');
        const messageSection = document.getElementById('messageSection');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');
        const resultContainer = document.getElementById('resultContainer');
        const loginBtn = document.getElementById('loginBtn');
        const userNameInput = document.getElementById('userName');
        const userPasswordInput = document.getElementById('userPassword');
        const loginError = document.getElementById('loginError');
        const formError = document.getElementById('formError');
        const modifyVoteBtn = document.getElementById('modifyVoteBtn');

        let currentUser = "";
        const COLLECTION_NAME = "voted_tokens_2026_q3_sep";

        // 장소 최대 2곳 제한 로직
        const restaurantCheckboxes = document.querySelectorAll('input[name="restaurant"]');
        restaurantCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const checkedCount = document.querySelectorAll('input[name="restaurant"]:checked').length;
                if (checkedCount > 2) {
                    cb.checked = false;
                    alert('장소는 최대 2곳까지만 선택할 수 있습니다.');
                }
            });
        });

        async function showResults() {
            try {
                const querySnapshot = await getDocs(collection(db, COLLECTION_NAME));
                
                let dateCounts = { "9월 10일 (목)": 0, "9월 11일 (금)": 0, "9월 17일 (목)": 0, "9월 18일 (금)": 0 };
                let restaurantCounts = {
                    "큰집막창생고기": 0, "후대화로 오산점": 0
                };
                let totalVoters = 0;

                querySnapshot.forEach((doc) => {
                    const userName = doc.id;
                    if (userName !== "테스트") { 
                        totalVoters++;
                        const data = doc.data();
                        
                        if (data.selected_dates) {
                            data.selected_dates.forEach(date => {
                                if (dateCounts[date] !== undefined) dateCounts[date]++;
                            });
                        }
                        
                        // 복수 선택 장소 카운트
                        if (data.selected_restaurants) {
                            data.selected_restaurants.forEach(rest => {
                                if (restaurantCounts[rest] !== undefined) restaurantCounts[rest]++;
                            });
                        } else if (data.selected_restaurant && restaurantCounts[data.selected_restaurant] !== undefined) {
                            // 이전 단일 선택 데이터 호환용
                            restaurantCounts[data.selected_restaurant]++;
                        }
                    }
                });

                const sortedDates = Object.entries(dateCounts).sort((a, b) => b[1] - a[1]);
                const sortedRestaurants = Object.entries(restaurantCounts).sort((a, b) => b[1] - a[1]);
                const dateMedals = ["🥇 1위", "🥈 2위", "🥉 3위", "4위"];
                const restMedals = ["🥇 1위", "🥈 2위", "🥉 3위", "4위"];

                let html = `<div class="text-center mb-6"><span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-sm font-bold px-4 py-1.5 rounded-full">실시간 ${totalVoters}명 참여중</span></div>`;

                html += `<h4 class="font-bold text-white text-lg mb-3">🗓️ 날짜 득표 순위</h4>`;
                html += `<ul class="space-y-3 mb-8">`;
                sortedDates.forEach((item, index) => {
                    html += `<li class="p-4 bg-slate-800/50 border border-slate-700 rounded-xl flex justify-between items-center shadow-lg">
                        <span class="font-semibold text-slate-200">${dateMedals[index] || ""} ${item[0]}</span>
                        <span class="font-bold text-indigo-300 bg-indigo-900/50 px-3 py-1 rounded-full">${item[1]} 표</span>
                    </li>`;
                });
                html += `</ul>`;

                html += `<h4 class="font-bold text-white text-lg mb-3 border-t border-slate-700 pt-6">🥩 장소 득표 순위</h4>`;
                html += `<ul class="space-y-3">`;
                sortedRestaurants.forEach((item, index) => { 
                    html += `<li class="p-4 bg-slate-800/50 border border-slate-700 rounded-xl flex justify-between items-center shadow-lg">
                        <span class="font-semibold text-slate-200">${restMedals[index] || ""} ${item[0]}</span>
                        <span class="font-bold text-emerald-300 bg-emerald-900/50 px-3 py-1 rounded-full">${item[1]} 표</span>
                    </li>`;
                });
                html += `</ul>`;

                html += `<button onclick="location.reload()" class="w-full mt-8 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 font-bold py-3 px-4 rounded-xl transition-all">🔄 실시간 랭킹 새로고침</button>`;
                resultContainer.innerHTML = html;

            } catch (error) {
                console.error("결과 불러오기 실패:", error);
                resultContainer.innerHTML = `<p class="text-rose-400 text-center">결과를 불러오는 데 실패했습니다.</p>`;
            }
        }

        loginBtn.addEventListener('click', async () => {
            const name = userNameInput.value.trim();
            const password = userPasswordInput.value.trim();
            
            if (!allowedUsers.hasOwnProperty(name)) {
                loginError.innerText = "등록되지 않은 이름입니다. 파트장에게 문의하세요.";
                loginError.classList.remove('hidden');
                return;
            }
            if (allowedUsers[name] !== password) {
                loginError.innerText = "입장 코드가 일치하지 않습니다.";
                loginError.classList.remove('hidden');
                return;
            }

            loginBtn.innerText = "데이터 확인 중...";
            loginBtn.disabled = true;
            loginError.classList.add('hidden');

            try {
                const tokenRef = doc(db, COLLECTION_NAME, name);
                const docSnap = await getDoc(tokenRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentUser = name;
                    
                    if (data.selected_dates) {
                        document.querySelectorAll('input[name="date"]').forEach(cb => {
                            cb.checked = data.selected_dates.includes(cb.value);
                        });
                    }
                    
                    // 복수 선택 장소 복원
                    if (data.selected_restaurants) {
                        data.selected_restaurants.forEach(rest => {
                            const cb = document.querySelector(`input[name="restaurant"][value="${rest}"]`);
                            if (cb) cb.checked = true;
                        });
                    } else if (data.selected_restaurant) {
                        const cb = document.querySelector(`input[name="restaurant"][value="${data.selected_restaurant}"]`);
                        if (cb) cb.checked = true;
                    }

                    loginSection.classList.add('hidden');
                    messageSection.classList.remove('hidden');
                    modifyVoteBtn.classList.remove('hidden');
                    
                    messageSection.className = "mt-6 text-center p-6 bg-indigo-900/20 rounded-2xl border border-indigo-500/30 backdrop-blur-sm";
                    messageTitle.className = "text-xl font-bold text-indigo-400 mb-2";
                    messageTitle.innerText = "🛑 이미 투표를 완료하셨습니다!";
                    messageText.innerText = "아래에서 현재 순위를 확인하거나 투표를 수정해 보세요.";
                    
                    await showResults(); 
                } else {
                    currentUser = name;
                    loginSection.classList.add('hidden');
                    voteForm.classList.remove('hidden');
                }
            } catch (error) {
                console.error("오류:", error);
                loginError.innerText = "서버 연결에 실패했습니다.";
                loginError.classList.remove('hidden');
                loginBtn.innerText = "로그인 및 투표 시작";
                loginBtn.disabled = false;
            }
        });

        userPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        modifyVoteBtn.addEventListener('click', () => {
            messageSection.classList.add('hidden');
            voteForm.classList.remove('hidden');
            const submitBtn = voteForm.querySelector('button[type="submit"]');
            submitBtn.disabled = false; 
            submitBtn.innerText = "✅ 투표 수정 완료하기"; 
        });

        voteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formError.classList.add('hidden');
            
            const checkedDates = document.querySelectorAll('input[name="date"]:checked');
            const selectedDates = Array.from(checkedDates).map(cb => cb.value);

            if (selectedDates.length === 0) {
                formError.innerText = "🚨 날짜를 최소 하루 이상 선택해 주세요!";
                formError.classList.remove('hidden');
                return;
            }

            const checkedRestaurants = document.querySelectorAll('input[name="restaurant"]:checked');
            const selectedRestaurants = Array.from(checkedRestaurants).map(cb => cb.value);

            if (selectedRestaurants.length === 0) {
                formError.innerText = "🚨 장소를 최소 1곳 이상 선택해 주세요!";
                formError.classList.remove('hidden');
                return;
            }
            if (selectedRestaurants.length > 2) {
                formError.innerText = "🚨 장소는 최대 2곳까지만 선택 가능합니다!";
                formError.classList.remove('hidden');
                return;
            }

            const submitBtn = voteForm.querySelector('button[type="submit"]');
            submitBtn.innerText = "안전하게 저장 중...";
            submitBtn.disabled = true;

            try {
                // 파이어베이스에 복수 선택 데이터를 저장하도록 변경
                await setDoc(doc(db, COLLECTION_NAME, currentUser), { 
                    selected_dates: selectedDates,
                    selected_restaurants: selectedRestaurants, 
                    time: new Date()
                });

                voteForm.classList.add('hidden');
                messageSection.classList.remove('hidden');
                modifyVoteBtn.classList.remove('hidden');
                
                messageSection.className = "mt-6 text-center p-6 bg-emerald-900/20 rounded-2xl border border-emerald-500/30 backdrop-blur-sm";
                messageTitle.className = "text-xl font-bold text-emerald-400 mb-2";
                messageTitle.innerText = "✅ 투표가 성공적으로 저장되었습니다!";
                messageText.innerHTML = `의견 감사합니다. 현재 종합 순위를 확인해 보세요.`;
                
                await showResults();

            } catch (error) {
                console.error("저장 오류:", error);
                formError.innerText = "앗, 저장 중 문제가 발생했습니다.";
                formError.classList.remove('hidden');
                submitBtn.innerText = "✅ 투표 제출하기";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
